
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Le Nuage</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #dcdff0;
        }
        header {
            background-color: #3d3f5b;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .logo {
            display: flex;
            align-items: center;
            font-size: 24px;
        }
        header nav a {
            margin-left: 20px;
            color: white;
            text-decoration: none;
        }
        .btn-login {
            background: white;
            color: #3d3f5b;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
        }
        .contact-container {
            width: 60%;
            margin: 50px auto;
            background: #b7b8dc;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input, textarea {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 12px;
            background: #3d3f5b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        footer {
            background: #3d3f5b;
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-around;
            margin-top: 60px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">☁️ Le Nuage — your movie companion</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">Feed</a>
        <a href="#">Profile</a>
        <a class="btn-login" href="#">Log in / Sign in</a>
    </nav>
</header>
<div class="contact-container">

<h2>Contactez-nous</h2>
    <form>
        <input type="text" placeholder="Votre nom" required />
        <input type="email" placeholder="Votre email" required />
        <textarea rows="6" placeholder="Votre message" required></textarea>
        <button type="submit">Envoyer</button>
    </form>
</div>

<footer>
    <div>Le Nuage</div>
    <div>
        <p>About</p>
        <p>Our goals</p>
    </div>
    <div>
        <p>Terms</p>
        <p>GDPR</p>
    </div>
    <div>
        <a href="contact.html" style="color:white;text-decoration: none;">Contact</a>
        <p>Help</p>
    </div>
</footer>

</body>
</html>
