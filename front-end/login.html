<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Nuage — Connexion</title>

    <link rel="stylesheet" href="style/style.css">

    <style>
        body {
            background: #e9ecff;
            font-family: "Inter", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #ffffff;
            padding: 40px;
            width: 350px;
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.10);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 25px;
            color: #3d3f5b;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #bbb;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #3d3f5b;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #2c2d42;
        }

        .small-link {
            margin-top: 15px;
            display: block;
            color: #3d3f5b;
            font-size: 14px;
            text-decoration: none;
        }

        .small-link:hover {
            text-decoration: underline;
        }

        .logo {
            font-size: 24px;
            margin-bottom: 10px;
            color: #3d3f5b;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">
    <div class="logo">☁️ Le Nuage</div>
    <h2>Connexion</h2>

    <form action="#" method="POST">
        <input type="text" class="login-input" name="username" placeholder="Username" required>
        <input type="password" class="login-input" name="password" placeholder="Password" required>

        <button class="login-btn" type="submit">Log in</button>
    </form>

    <a class="small-link" href="#">Forgot your password?</a>
    <a class="small-link" href="signup.html">Create an account</a>
    <a class="small-link" href="home.html">Return to homepage</a>
</div>

</body>
</html>
