<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Nuage — Create an Account</title>

    <style>
        body {
            background: #e9ecff;
            font-family: "Inter", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .signup-box {
            background: #ffffff;
            padding: 40px;
            width: 380px;
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .signup-box h2 {
            color: #3d3f5b;
            margin-bottom: 25px;
        }

        .signup-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #bbb;
            font-size: 15px;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background: #3d3f5b;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #2c2d42;
        }

        .small-link {
            margin-top: 15px;
            display: block;
            color: #3d3f5b;
            font-size: 14px;
            text-decoration: none;
        }

        .small-link:hover {
            text-decoration: underline;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3d3f5b;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="signup-box">
    <div class="logo">☁️ Le Nuage</div>
    <h2>Create an Account</h2>

    <form action="#" method="POST">
        <input type="text" class="signup-input" name="username" placeholder="Username" required>

        <input type="email" class="signup-input" name="email" placeholder="Email address" required>

        <input type="password" class="signup-input" name="password" placeholder="Password" required>

        <input type="password" class="signup-input" name="confirm_password" placeholder="Confirm password" required>

        <button class="signup-btn" type="submit">Sign Up</button>
    </form>

    <a class="small-link" href="login.html">Already have an account? Log in</a>
    <a class="small-link" href="home.html">Back to home</a>
</div>

</body>
</html>
